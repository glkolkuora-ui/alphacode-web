<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alpha Code" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Alpha Code — Área de Membros</title>
    <script>
      (function () {
        var path = (location.pathname || '').replace(/\/+$/, '') || '/'
        if (!/\/auth\/callback$/.test(path)) return
        var params = new URLSearchParams(location.search)
        var code = params.get('code')
        var error = params.get('error')
        var WEB_RETURN_KEY = 'alphacode_oauth_return'
        function allowedReturn(raw) {
          try {
            var u = new URL(raw)
            var host = u.hostname.toLowerCase()
            if (u.protocol === 'https:' && /\.up\.railway\.app$/i.test(host)) return u.origin
            if (u.protocol === 'https:' && /(^|\.)traderjusticeiro\.com$/i.test(host)) return u.origin
            if ((host === 'localhost' || host === '127.0.0.1') && (u.protocol === 'http:' || u.protocol === 'https:')) return u.origin
          } catch (e) {}
          return ''
        }
        function isBrokerAuthUrl(raw) {
          try {
            var u = new URL(raw)
            var host = u.hostname.toLowerCase()
            return u.protocol === 'https:' && (/(^|\.)broker10\.com$/i.test(host) || host.indexOf('broker10') !== -1)
          } catch (e) { return false }
        }
        function readReturnCookie() {
          try {
            var m = document.cookie.match(/(?:^|; )cw_oauth_return=([^;]*)/)
            return m ? allowedReturn(decodeURIComponent(m[1])) : ''
          } catch (e) { return '' }
        }
        var webReturn = allowedReturn(params.get('web_return') || '') || allowedReturn(params.get('state') || '')
        var authUrl = params.get('auth_url') || ''
        if (!code && !error && webReturn && isBrokerAuthUrl(authUrl)) {
          try { sessionStorage.setItem(WEB_RETURN_KEY, webReturn) } catch (e) {}
          try {
            document.cookie = 'cw_oauth_return=' + encodeURIComponent(webReturn) + '; Max-Age=600; Path=/; Secure; SameSite=Lax'
          } catch (e) {}
          location.replace(authUrl)
          return
        }
        if (code) {
          var webOrigin = ''
          try {
            webOrigin = allowedReturn(sessionStorage.getItem(WEB_RETURN_KEY) || '') || readReturnCookie() || allowedReturn(params.get('state') || '')
            sessionStorage.removeItem(WEB_RETURN_KEY)
          } catch (e) {}
          if (webOrigin) {
            location.replace(webOrigin + '/auth/callback?code=' + encodeURIComponent(code))
          }
        }
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Geist:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
