<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha Code — Autenticando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(57, 255, 20, 0.12), transparent 55%),
        #000;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 44px 36px 32px;
      border-radius: 18px;
      text-align: center;
      background: #050806;
      border: 1px solid rgba(57, 255, 20, 0.22);
      box-shadow:
        0 0 0 1px rgba(57, 255, 20, 0.06) inset,
        0 28px 64px -16px rgba(0, 0, 0, 0.75);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
    }
    .logo span { color: #39FF14; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(57, 255, 20, 0.18);
      border-top-color: #39FF14;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 22px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      margin-top: 18px;
      font-size: 12px;
      color: #737373;
      font-family: ui-monospace, monospace;
    }

    .error-box {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: #120808;
      color: #fecaca;
      font-size: 13px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ALPHA <span>CODE</span></div>

    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Validando login...</h1>
      <p>Aguarde enquanto transferimos a autorização da corretora.</p>
      <div class="status" id="status-text">Processando...</div>
    </div>

    <div id="state-success" style="display:none">
      <h1>Conectado</h1>
      <p>Pode fechar esta aba e voltar ao Alpha Code.</p>
    </div>

    <div id="state-error" style="display:none">
      <h1>Falha na autenticação</h1>
      <p>Não foi possível concluir o login automaticamente.</p>
      <div class="error-box" id="error-msg"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const code = params.get('code')
    const error = params.get('error')
    const WEB_RETURN_KEY = 'alphacode_oauth_return'

    function show(id) {
      ;['state-loading', 'state-success', 'state-error'].forEach(function (s) {
        document.getElementById(s).style.display = s === id ? 'block' : 'none'
      })
    }

    function isAllowedReturn(raw) {
      try {
        const u = new URL(raw)
        const host = u.hostname.toLowerCase()
        if (u.protocol === 'https:' && /\.up\.railway\.app$/i.test(host)) return u.origin
        if (u.protocol === 'https:' && /(^|\.)traderjusticeiro\.com$/i.test(host)) return u.origin
        if (
          (host === 'localhost' || host === '127.0.0.1') &&
          (u.protocol === 'http:' || u.protocol === 'https:')
        ) {
          return u.origin
        }
        return ''
      } catch (e) {
        return ''
      }
    }

    function isBrokerAuthUrl(raw) {
      try {
        const u = new URL(raw)
        const host = u.hostname.toLowerCase()
        return u.protocol === 'https:' && (/(^|\.)broker10\.com$/i.test(host) || host.includes('broker10'))
      } catch (e) {
        return false
      }
    }

    function readReturnCookie() {
      try {
        const m = document.cookie.match(/(?:^|; )cw_oauth_return=([^;]*)/)
        return m ? isAllowedReturn(decodeURIComponent(m[1])) : ''
      } catch (e) {
        return ''
      }
    }

    function writeReturnCookie(origin) {
      try {
        document.cookie = 'cw_oauth_return=' + encodeURIComponent(origin)
          + '; Max-Age=600; Path=/; Secure; SameSite=Lax'
      } catch (e) {}
    }

    const webReturn = isAllowedReturn(params.get('web_return') || '')
      || isAllowedReturn(params.get('state') || '')
    const authUrl = params.get('auth_url') || ''

    if (!code && !error && webReturn && isBrokerAuthUrl(authUrl)) {
      try { sessionStorage.setItem(WEB_RETURN_KEY, webReturn) } catch (e) {}
      writeReturnCookie(webReturn)
      document.getElementById('status-text').textContent = 'Abrindo autorização...'
      window.location.replace(authUrl)
    } else if (error) {
      show('state-error')
      const box = document.getElementById('error-msg')
      box.style.display = 'block'
      box.textContent = 'Erro: ' + error
    } else if (code) {
      let webOrigin = ''
      try {
        webOrigin = isAllowedReturn(sessionStorage.getItem(WEB_RETURN_KEY) || '')
          || readReturnCookie()
          || isAllowedReturn(params.get('state') || '')
        sessionStorage.removeItem(WEB_RETURN_KEY)
      } catch (e) {}

      if (webOrigin) {
        document.getElementById('status-text').textContent = 'Voltando para o Alpha Code...'
        window.location.replace(webOrigin + '/auth/callback?code=' + encodeURIComponent(code))
      } else {
        show('state-success')
        try {
          localStorage.setItem('cw_broker_auth', JSON.stringify({ ok: true, code: code, t: Date.now() }))
        } catch (e) {}
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ channel: 'broker:connected', code: code }, '*')
            window.opener.focus()
          }
        } catch (e) {}
        setTimeout(function () {
          try { window.close() } catch (e) {}
        }, 1200)
      }
    } else {
      show('state-error')
      document.getElementById('error-msg').style.display = 'block'
      document.getElementById('error-msg').textContent =
        'Nenhum código de autorização encontrado na URL.'
    }
  </script>
</body>
</html>
